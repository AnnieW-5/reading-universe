<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading Universe">
<meta name="theme-color" content="#1d3a38">
<title>My Reading Universe</title>
<style>
:root{--bg:#eef1ec;--card:#fbfcfa;--ink:#1d2b2a;--mute:#667673;--line:#d3dbd4;--acc:#1f5f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang TC",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Songti TC","Noto Serif TC",serif;margin:0 0 10px}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px;margin-top:22px}
main{max-width:640px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px 0;font-size:14px;color:var(--mute)}
nav button.on{color:var(--acc);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:12px 18px;font-weight:600;min-height:44px}
.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.bad{background:none;color:#a33;border:1px solid #a33}
.btn:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:700 30px "Songti TC",serif}
.stat span{font-size:14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.shelf .bk{flex:0 0 96px}
.bk{border:0;background:none;padding:0;text-align:left}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;padding:10px 8px 8px 12px;color:#fff;font:700 14px/1.3 "Songti TC",serif;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:inset 5px 0 0 rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.22)}
.cover small{font:400 11px sans-serif;opacity:.85}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.row span{display:block;font-size:14px;color:var(--mute)}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tools{display:flex;gap:8px;margin:8px 0}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit}
textarea{min-height:84px}
label{display:block;margin:14px 0 4px;font-size:14px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);text-align:center;padding:36px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.bar i{display:block;height:12px;background:var(--acc);border-radius:6px;min-width:2px}
.bar em{width:34px;font-style:normal;color:var(--mute)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:9}
#sheet.open{display:flex}
#panel{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
.dh{display:flex;gap:14px;margin-bottom:12px}.dh .cover{width:104px;flex:none}
.meta p{margin:2px 0;font-size:15px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.note{font-size:13px;color:var(--mute);margin-top:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.lk{border:0;background:none;color:var(--acc);padding:10px 8px;font-size:14px}
.tm{font:700 36px "Songti TC",serif;text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
.txt{white-space:pre-wrap;margin:0 0 6px}
.pg{font-size:13px;color:var(--mute)}
 .res{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px}
.res img,.res i{width:44px;height:66px;object-fit:cover;border-radius:2px;flex:none;background:#cfd6d0}
.res span{font-size:14px;color:var(--mute)}.res b{font-size:16px;color:var(--ink)}
.grid.wall{grid-template-columns:repeat(4,1fr);gap:12px 10px}
button.bar{width:100%;background:none;border:0;padding:3px 0;text-align:left}
.bar em.k{width:96px;flex:none}
.car{height:290px;perspective:900px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:6px 0}
.ring{position:relative;width:110px;height:165px;margin:48px auto 0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.ring.drag{transition:none}
.it{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shelf3d{perspective:700px;margin:12px 0 22px}
.bks{display:flex;align-items:flex-end;justify-content:center;gap:3px;transform:rotateX(6deg);transform-origin:bottom;transform-style:preserve-3d}
.spine{width:44px;border:0;border-radius:2px;color:#fff;padding:8px 0;box-shadow:inset 2px 0 0 rgba(255,255,255,.18),2px 0 5px rgba(0,0,0,.3);transition:transform .25s}
.spine:active{transform:translateZ(28px) rotateY(-20deg)}
.spine span{display:block;writing-mode:vertical-rl;max-height:100%;overflow:hidden;font:700 13px "Songti TC",serif;margin:auto}
.board{height:14px;background:linear-gradient(#8a6a4a,#5d4630);border-radius:2px;box-shadow:0 7px 9px rgba(0,0,0,.28)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
<button data-a="tab" data-t="home">首頁</button>
<button data-a="tab" data-t="books">我的書</button>
<button data-a="tab" data-t="sum">閱讀統計</button>
<button data-a="tab" data-t="add">新增書籍</button>
</nav>
<div id="sheet"><div id="panel"></div></div>
<script>
const APP_VERSION='2026-11-20-1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const NOW=new Date().getFullYear();
const FMT={Physical:'實體書',Ebook:'電子書',Audiobook:'有聲書'},OWN={Owned:'自己擁有',Borrowed:'借閱'};
const SRC=['微信讀書','其他電子書平台','個人藏書','朋友借閱','圖書館'];
const DEF=['歷史','小說／文學','心理／自我成長','哲學／思想','商業／經濟','科學／科技','傳記／人物','社會／政治','藝術／文化','其他'];
let db,books=[],cats=[],tab='home',shelf='want',q='',catF='',yF='',view='grid',sy=NOW,editing=null;

const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('reading-universe',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'book_id'});r.result.createObjectStore('categories',{keyPath:'category_id'})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const getAll=s=>new Promise((ok,no)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const put=(s,o)=>new Promise((ok,no)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=ok;t.onerror=()=>no(t.error)});
const del=(s,id)=>new Promise((ok,no)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)});

async function loadBooks(){const a=(await getAll('books')).filter(b=>!b.deleted);books=a.filter(b=>!b.is_inbox);inbox=a.filter(b=>b.is_inbox)}
const catName=id=>cats.find(c=>c.category_id===id)?.name||'未分類';
const dur=s=>{s=s||0;return Math.floor(s/3600)+' 小時 '+Math.floor(s%3600/60)+' 分'};
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const coverEl=b=>{const h=hue(b.title);return `<div class="cover" style="position:relative;background:linear-gradient(160deg,hsl(${h} 38% 34%),hsl(${(h+30)%360} 40% 22%))">${b.cover_image?`<img src="${esc(b.cover_image)}" alt="" loading="lazy" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:''}<span>${esc(b.title)}</span><small>${esc(b.author)}</small></div>`};
const cover=b=>`<button class="bk" data-a="book" data-id="${b.book_id}">${coverEl(b)}</button>`;
const row=b=>`<button class="row" data-a="book" data-id="${b.book_id}"><b>${esc(b.title)}</b><span>${esc(b.author)||'作者未填'} ・ ${esc(catName(b.category_id))}</span></button>`;
const reads=()=>books.filter(b=>b.status==='read');
const opts=(o,v,empty)=>(empty?'<option value="">未選擇</option>':'')+Object.entries(o).map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('');

function home(){
 const yb=reads().filter(b=>b.completed_year===NOW),secs=yb.reduce((a,b)=>a+(b.total_reading_seconds||0),0);
 const added=[...books].sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,8);
 const rec=[...reads()].sort((a,b)=>(b.completed_year*100+(b.completed_month||0))-(a.completed_year*100+(a.completed_month||0))).slice(0,8);
 const sh=(t,a,m)=>`<h3>${t}</h3>`+(a.length?`<div class="shelf">${a.map(cover).join('')}</div>`:`<p class="empty">${m}</p>`);
 return `<h1>My Reading Universe</h1><button class="lk" id="syncl" data-a="settings" style="padding:0 0 8px">${syncLabel()}</button>${inbox.length?`<br><button class="lk" data-a="inbox" style="padding:0 0 8px">📝 暫存金句（${inbox.length}）</button>`:''}
 <div class="stats"><div class="stat"><b>${yb.length}</b><span>${NOW} 年已讀完（本）</span></div><div class="stat"><b>${Math.floor(secs/3600)}<small style="font-size:15px"> 時 ${Math.floor(secs%3600/60)} 分</small></b><span>${NOW} 年閱讀時長</span></div></div>
 <button class="btn" data-a="new">＋ 快速新增書籍</button>
 ${sh('最近新增',added,'還沒有書，從上方按鈕新增第一本。')}
 ${sh('最近讀完',rec,'讀完的書會出現在這裡。')}`;
}
function listHTML(){
 let a=books.filter(b=>b.status===shelf);
 if(q){const k=q.toLowerCase();a=a.filter(b=>(b.title+' '+b.author).toLowerCase().includes(k))}
 if(catF)a=a.filter(b=>b.category_id===catF);
 if(shelf==='read'&&yF)a=a.filter(b=>String(b.completed_year)===yF);
 a.sort((x,y)=>y.updated_at.localeCompare(x.updated_at));
 if(!a.length)return `<p class="empty">${books.some(b=>b.status===shelf)?'沒有符合條件的書。':shelf==='want'?'想讀清單是空的。':'還沒有讀完的書。'}</p>`;
 return view==='grid'?`<div class="grid">${a.map(cover).join('')}</div>`:`<div>${a.map(row).join('')}</div>`;
}
function booksPage(){
 const ys=[...new Set(reads().map(b=>b.completed_year))].sort((a,b)=>b-a);
 return `<h1>我的書</h1>
 <div class="seg"><button data-a="shelf" data-v="want" class="${shelf==='want'?'on':''}">想讀（${books.filter(b=>b.status==='want').length}）</button><button data-a="shelf" data-v="read" class="${shelf==='read'?'on':''}">已讀（${reads().length}）</button></div>
 <input id="q" placeholder="搜尋書名或作者" value="${esc(q)}">
 <div class="tools"><select id="catF"><option value="">全部分類</option>${cats.map(c=>`<option value="${c.category_id}"${c.category_id===catF?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
 ${shelf==='read'?`<select id="yF"><option value="">全部年份</option>${ys.map(y=>`<option${String(y)===yF?' selected':''}>${y}</option>`).join('')}</select>`:''}
 <button class="btn alt" data-a="view" style="flex:none">${view==='grid'?'清單':'封面'}</button></div>
 <div id="list">${listHTML()}</div>`;
}
let sv='wall',car={a:0,n:1,st:360};
const ybs=()=>reads().filter(b=>b.completed_year===sy).sort((a,b)=>(a.completed_month||0)-(b.completed_month||0));
const tally=(arr,f)=>{const m=new Map();for(const b of arr){const k=f(b)||'未填';m.set(k,(m.get(k)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1])};
const barCard=(t,rows)=>`<div class="card"><h2>${t}</h2>${rows.length?rows.map(([k,n])=>`<div class="bar"><em class="k">${esc(k)}</em><i style="width:${n/rows[0][1]*45}%"></i><span>${n} 本</span></div>`).join(''):'<p class="note">沒有資料</p>'}</div>`;
function carHTML(a){
 const n=a.length,st=360/n,R=Math.min(380,Math.max(120,55/Math.tan(Math.PI/Math.max(n,3))+16));car.n=n;car.st=st;
 return `<div class="car" id="car"><div class="ring" id="ring">${a.map((b,i)=>`<div class="it" data-id="${b.book_id}" style="transform:rotateY(${i*st}deg) translateZ(${R}px)">${coverEl(b)}</div>`).join('')}</div></div><p class="note" id="carlab" style="text-align:center;margin-top:0"></p><p class="note" style="text-align:center">左右拖曳旋轉，點封面查看書籍</p>`;
}
function carSet(){
 const r=$('#ring');if(!r)return;r.style.transform='rotateY('+car.a+'deg)';
 const i=((Math.round(-car.a/car.st)%car.n)+car.n)%car.n,b=ybs()[i],l=$('#carlab');if(l&&b)l.textContent=b.title+(b.author?'・'+b.author:'');
}
function bindCar(){
 const c=$('#car'),r=$('#ring');if(!c)return;car.a=0;carSet();
 let x0=0,a0=0,drag=false,down=false,lx=0,lt=0,v=0;
 c.addEventListener('pointerdown',e=>{down=true;drag=false;x0=lx=e.clientX;a0=car.a;lt=e.timeStamp;v=0});
 c.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-x0;
  if(!drag&&Math.abs(dx)>6){drag=true;r.classList.add('drag');if(c.setPointerCapture)try{c.setPointerCapture(e.pointerId)}catch(x){}}
  if(drag){car.a=a0+dx*.5;const dt=e.timeStamp-lt;if(dt>0)v=(e.clientX-lx)/dt;lx=e.clientX;lt=e.timeStamp;carSet()}});
 const end=e=>{if(!down)return;down=false;
  if(drag){r.classList.remove('drag');const k=Math.max(-150,Math.min(150,v*30));car.a=Math.round((car.a+k)/car.st)*car.st;carSet()}
  else{const it=e.target.closest&&e.target.closest('.it'),b=it&&books.find(x=>x.book_id===it.dataset.id);if(b){nEdit=qEdit=null;detail(b)}}};
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function shelfHTML(a){
 const per=7,rows=[];for(let i=0;i<a.length;i+=per)rows.push(a.slice(i,i+per));
 return rows.map(r=>`<div class="shelf3d"><div class="bks">${r.map(b=>{const h=hue(b.title);return `<button class="spine" data-a="book" data-id="${b.book_id}" style="height:${128+(h%5)*8}px;background:linear-gradient(90deg,hsl(${h} 38% 26%),hsl(${h} 38% 40%),hsl(${h} 38% 26%))"><span>${esc(b.title)}</span></button>`}).join('')}</div><div class="board"></div></div>`).join('');
}
function monthSheet(m){
 const x=ybs().filter(b=>b.completed_month===m),secs=x.reduce((t,b)=>t+(b.total_reading_seconds||0),0);
 openSheet(`<h2>${sy} 年 ${m} 月</h2><p class="note" style="margin-top:0">讀完 ${x.length} 本・${dur(secs)}</p><div class="grid">${x.map(cover).join('')}</div><div class="acts"><button class="btn alt" data-a="close">關閉</button></div>`);
}
function sumPage(){
 const ys=[...new Set([NOW,...reads().map(b=>b.completed_year)])].sort((a,b)=>b-a),yb=ybs(),secs=yb.reduce((t,b)=>t+(b.total_reading_seconds||0),0);
 const m=Array.from({length:12},(_,i)=>{const x=yb.filter(b=>b.completed_month===i+1);return{n:x.length,s:x.reduce((t,b)=>t+(b.total_reading_seconds||0),0)}});
 const mx=Math.max(1,...m.map(x=>x.n));
 const show=sv==='car'?carHTML(yb):sv==='shelf'?shelfHTML(yb):`<div class="grid wall">${yb.map(cover).join('')}</div>`;
 const sg=(v,l)=>`<button data-a="sv" data-v="${v}" class="${sv===v?'on':''}">${l}</button>`;
 return `<h1>閱讀統計</h1><select id="sy">${ys.map(y=>`<option${y===sy?' selected':''}>${y}</option>`).join('')}</select>
 <div class="stats"><div class="stat"><b>${yb.length}</b><span>已讀完（本）</span></div><div class="stat"><b style="font-size:22px;line-height:40px">${dur(secs)}</b><span>總閱讀時長</span></div></div>
 <h3>${sy} 年讀完的書</h3>
 ${yb.length?`<div class="seg">${sg('wall','封面牆')}${sg('car','輪播')}${sg('shelf','書架')}</div>${show}`:'<p class="empty">這一年還沒有讀完的書。</p>'}
 <div class="card"><h2>每月完讀</h2>${m.map((x,i)=>{const row=`<em>${i+1} 月</em><i style="width:${x.n/mx*50}%"></i><span>${x.n} 本${x.s?'・'+dur(x.s):''}</span>`;return x.n?`<button class="bar" data-a="month" data-m="${i+1}">${row}</button>`:`<div class="bar">${row}</div>`}).join('')}<p class="note" style="margin-bottom:0">點有書的月份，可查看當月讀完的封面。</p></div>
 ${barCard('依分類',tally(yb,b=>catName(b.category_id)))}${barCard('依閱讀媒介',tally(yb,b=>FMT[b.reading_format]))}${barCard('依取得方式',tally(yb,b=>OWN[b.ownership_status]))}`;
}
function addPage(){
 return `<h1>新增書籍</h1>
 ${pendingQ?`<div class="card"><p class="note" style="margin-top:0">待加入的金句：${esc(pendingQ.content.slice(0,60))}…<br>請搜尋或手動新增這本書，儲存後會自動加入。</p><button class="btn alt" data-a="pq_cancel">取消</button></div>`:''}
 <div class="card"><h2>搜尋書籍</h2><div class="two" style="grid-template-columns:1fr auto"><input id="sq" placeholder="書名、作者或 ISBN" value="${esc(sq)}" enterkeyhint="search" autocapitalize="off"><button class="btn" data-a="search">搜尋</button></div><p class="note" id="smsg">${esc(smsg)}</p><div id="sres">${srHTML()}</div></div>
 <div class="card"><h2>拍照・相簿</h2><p class="note" style="margin-top:0">拍書封、書介頁或金句截圖。文字辨識在你的手機上進行，圖片不會上傳。第一次使用會下載辨識元件與中文語言檔，建議用 Wi-Fi。</p>
 <div class="acts" style="margin-top:0"><button class="btn" data-a="cam">拍照</button><button class="btn alt" data-a="pic">從相簿選擇</button></div>
 <input type="file" id="f_cam" accept="image/*" capture="environment" hidden><input type="file" id="f_pic" accept="image/*" hidden>
 ${ocrHTML()}</div>
 <div class="card"><h2>手動輸入</h2><p class="note" style="margin-top:0">找不到書或辨識失敗時，自己輸入書名與作者。</p><button class="btn alt" data-a="new">開始輸入</button></div>`;
}
function render(){
 $('#app').innerHTML={home,books:booksPage,sum:sumPage,add:addPage}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='sum'&&sv==='car')bindCar();
}
const openSheet=h=>{$('#panel').innerHTML=h;$('#sheet').classList.add('open');$('#panel').scrollTop=0};
const closeSheet=()=>{$('#sheet').classList.remove('open');editing=null;nEdit=qEdit=null};

let nEdit=null,qEdit=null;
const fd=x=>{x=Math.max(0,Math.round(x));const p=n=>String(n).padStart(2,'0');return p(Math.floor(x/3600))+':'+p(Math.floor(x%3600/60))+':'+p(x%60)};
const ds=x=>x<60?x+' 秒':dur(x);
const dt=i=>{const d=new Date(i);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
const elapsed=b=>{const t=b.timer;return t?t.acc+(t.running?Date.now()-t.startedAt:0):0};

 if(syncing){syncAgain=true;return}
 syncing=true;setSt('busy','同步中…');
 try{
  const last=localStorage.getItem('ru_last')||'',t0=new Date().toISOString(),raw=await getAll('books');
  const push=raw.filter(b=>(b.updated_at||'')>last).map(b=>{const {timer,...r}=b;return{type:'book',id:b.book_id,updated_at:b.updated_at||'',json:JSON.stringify(r)}});
  const res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:k,action:'sync',records:push})});
  const d=await res.json();
  if(!d.ok)throw new Error(d.error==='unauthorized'?'密碼錯誤，請確認與 Apps Script 內的 SECRET 一致':d.error);
  const loc=new Map(raw.map(b=>[b.book_id,b]));let down=0;

  localStorage.setItem('ru_last',t0);

  if(down&&!$('#sheet').classList.contains('open'))render();

 }catch(err){

 if(syncAgain){syncAgain=false;queueSync()}
}

 openSheet(`<h2>暫存金句（${inbox.length}）</h2>`+(inbox.length?inbox.map(x=>`<div class="card"><p class="txt">${esc(x.content)}</p><p class="pg">${x.page_number?'第 '+esc(x.page_number)+' 頁':'未填頁碼'}</p><select id="ib_${x.book_id}">${bookOpts()}</select><div class="acts" style="margin-top:8px"><button class="btn" data-a="ib_file" data-x="${x.book_id}">歸檔到這本書</button><button class="btn bad" data-a="ib_del" data-x="${x.book_id}">刪除</button></div></div>`).join(''):'<p class="empty">沒有暫存的金句。</p>')+'<div class="acts"><button class="btn alt" data-a="close">關閉</button></div>');
}
async function checkUpdate(){
 if($('#sheet').classList.contains('open')||(ocr&&ocr.busy))return;
 try{
  const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
  const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
  if(m&&m[1]!==APP_VERSION&&sessionStorage.getItem('ru_reload')!==m[1]){
   sessionStorage.setItem('ru_reload',m[1]);
   location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash);
  }
 }catch(e){}
}
function applySetup(){
 const m=location.hash.match(/^#setup=(.+)$/);if(!m||localStorage.getItem('ru_url'))return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  if(o.u)localStorage.setItem('ru_url',o.u);if(o.k)localStorage.setItem('ru_key',o.k);if(o.g)localStorage.setItem('ru_gkey',o.g);
  localStorage.removeItem('ru_last');
 }catch(e){}
 history.replaceState(null,'',location.pathname);
}
document.addEventListener('click',async e=>{
 if(e.target.id==='sheet')return closeSheet();
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,b=books.find(x=>x.book_id===t.dataset.id);
 if(a==='tab'){tab=t.dataset.t;render();scrollTo(0,0)}
 else if(a==='shelf'){shelf=t.dataset.v;render()}
 else if(a==='view'){view=view==='grid'?'list':'grid';render()}
 else if(a==='book'&&b){nEdit=qEdit=null;detail(b)}
 else if(a==='new'){editing=null;openSheet(form({status:'want',category_id:cats[0]?.category_id}))}
 else if(a==='edit'&&b){editing=b;openSheet(form(b))}
 else if(a==='markread'&&b){editing=b;openSheet(form({...b,status:'read'}))}
 else if(a==='del'&&b){if(confirm('確定刪除「'+b.title+'」？此動作無法復原。')){await put('books',{...b,deleted:true,updated_at:new Date().toISOString()});await loadBooks();closeSheet();render();queueSync()}}
 else if(a==='tstart'&&b)upd(b,x=>{x.timer={running:true,startedAt:Date.now(),acc:0,first:Date.now()}});
 else if(a==='tpause'&&b)upd(b,x=>{x.timer={...x.timer,running:false,acc:elapsed(x)}});
 else if(a==='tresume'&&b)upd(b,x=>{x.timer={...x.timer,running:true,startedAt:Date.now()}});
 else if(a==='tend'&&b){const sec=Math.round(elapsed(b)/1000);if(sec>0&&!confirm('結束閱讀並記錄 '+ds(sec)+'？'))return;
  upd(b,x=>{if(sec>0){(x.sessions=x.sessions||[]).push({session_id:uid(),book_id:x.book_id,start:new Date(x.timer.first||Date.now()).toISOString(),seconds:sec});x.total_reading_seconds=(x.total_reading_seconds||0)+sec}x.timer=null})}
 else if(a==='sdel'&&b){const r=(b.sessions||[]).find(z=>z.session_id===t.dataset.x);if(r&&confirm('刪除這筆閱讀紀錄？'))upd(b,x=>{x.sessions=x.sessions.filter(z=>z!==r);x.total_reading_seconds=Math.max(0,(x.total_reading_seconds||0)-r.seconds)})}
 else if(a==='sedit'&&b){const r=(b.sessions||[]).find(z=>z.session_id===t.dataset.x);if(!r)return;const v=prompt('這次閱讀幾分鐘？',Math.round(r.seconds/60));if(v===null||v.trim()===''||isNaN(+v)||+v<0)return;const n=Math.round(+v*60);upd(b,x=>{x.total_reading_seconds=Math.max(0,(x.total_reading_seconds||0)-r.seconds+n);r.seconds=n})}
 else if(a==='nsave'&&b){const v=$('#n_txt').value.trim();if(!v)return alert('請輸入內容');const k=nEdit;nEdit=null;upd(b,x=>{x.notes=x.notes||[];const n=x.notes.find(z=>z.note_id===k);if(n)n.content=v;else x.notes.push({note_id:uid(),book_id:x.book_id,content:v,created_at:new Date().toISOString()})})}
 else if(a==='nedit'&&b){nEdit=t.dataset.x;showDetail(b.book_id);$('#n_txt').focus()}
 else if(a==='ncancel'&&b){nEdit=null;showDetail(b.book_id)}
 else if(a==='ndel'&&b){if(confirm('刪除這則讀後感？'))upd(b,x=>{x.notes=x.notes.filter(z=>z.note_id!==t.dataset.x)})}
 else if(a==='qsave'&&b){const v=$('#q_txt').value.trim();if(!v)return alert('請輸入金句');const pg=$('#q_pg').value.trim(),k=qEdit;qEdit=null;upd(b,x=>{x.quotes=x.quotes||[];const q=x.quotes.find(z=>z.quote_id===k);if(q){q.content=v;q.page_number=pg}else x.quotes.push({quote_id:uid(),book_id:x.book_id,content:v,page_number:pg,created_at:new Date().toISOString()})})}
 else if(a==='qedit'&&b){qEdit=t.dataset.x;showDetail(b.book_id);$('#q_txt').focus()}
 else if(a==='qcancel'&&b){qEdit=null;showDetail(b.book_id)}
 else if(a==='qdel'&&b){if(confirm('刪除這句金句？'))upd(b,x=>{x.quotes=x.quotes.filter(z=>z.quote_id!==t.dataset.x)})}
 else if(a==='month')monthSheet(+t.dataset.m);
 else if(a==='sv'){sv=t.dataset.v;render()}
 else if(a==='cam')$('#f_cam').click();
 else if(a==='pic')$('#f_pic').click();
 else if(a==='o_clear'){ocr=null;render()}
 else if(a==='o_book'){
  const fresh=ocr.lines&&ocr.lines.length&&ocr.text===ocr.orig;
  const g=fresh?guessTitle(ocr.lines):'';
  const rest=fresh?[...ocr.lines].sort((x,y)=>y.h-x.h).map(x=>x.t):(ocr.text||'').split('\n').map(x=>x.trim()).filter(x=>x.length>=2);
  ocrLines=[g,...rest.filter(x=>x!==g)].filter(Boolean).slice(0,12);
  ocr.step=ocrLines.length?'<p class="note">'+(g?'已依字體大小推測書名並自動搜尋。如果不對，點下面其他行重新搜尋（字體大的排前面）：':'點書名那一行來搜尋（也可以先修改上方文字）：')+'</p>'+ocrLines.map((l,i)=>`<button class="row" data-a="o_pick" data-i="${i}">${i===0&&g?'推測書名：':''}${esc(l)}</button>`).join(''):'<p class="note">沒有可用的文字，請在上方輸入書名後再試。</p>';
  if(g)sq=g;render();
  if(g){const el=$('#sq');if(el)el.scrollIntoView({block:'center'});doSearch()}}
 else if(a==='o_pick'){sq=ocrLines[+t.dataset.i]||'';render();const el=$('#sq');if(el)el.scrollIntoView({block:'center'});doSearch()}
 else if(a==='o_quote'){ocr.step='<label>頁碼（可選）</label><input id="o_pg" placeholder="例如 123"><label>加入哪一本書？</label><select id="o_sel">'+bookOpts()+'</select><div class="acts" style="margin-top:10px"><button class="btn" data-a="oq_add">加到這本書</button><button class="btn alt" data-a="oq_new">建立新書後加入</button><button class="btn alt" data-a="oq_inbox">暫時保存，稍後歸檔</button></div>';render()}
 else if(a==='oq_add'){const v=qtext(),id=$('#o_sel').value;if(!v)return alert('沒有可儲存的文字');if(!id)return alert('請先選擇書籍');const b2=books.find(x=>x.book_id===id);if(!b2)return;
  const now=new Date().toISOString();(b2.quotes=b2.quotes||[]).push({quote_id:uid(),book_id:id,content:v,page_number:$('#o_pg').value.trim(),created_at:now});b2.updated_at=now;await put('books',b2);ocr={msg:'已將金句加入《'+b2.title+'》。'};render();queueSync()}
 else if(a==='oq_new'){const v=qtext();if(!v)return alert('沒有可儲存的文字');pendingQ={content:v,page:$('#o_pg').value.trim()};ocr=null;render();scrollTo(0,0)}
 else if(a==='oq_inbox'){const v=qtext();if(!v)return alert('沒有可儲存的文字');const now=new Date().toISOString();
  await put('books',{book_id:'inbox-'+uid(),is_inbox:true,title:'（暫存金句）',content:v,page_number:$('#o_pg').value.trim(),created_at:now,updated_at:now});await loadBooks();ocr={msg:'已暫存。之後可在首頁的「暫存金句」歸檔。'};render();queueSync()}
 else if(a==='pq_cancel'){pendingQ=null;render()}
 else if(a==='inbox')inboxSheet();
 else if(a==='ib_file'){const id=t.dataset.x,sel=$('#ib_'+id)?.value,it=inbox.find(x=>x.book_id===id),tg=books.find(x=>x.book_id===sel);if(!it)return;if(!tg)return alert('請先選擇書籍');
  const now=new Date().toISOString();(tg.quotes=tg.quotes||[]).push({quote_id:uid(),book_id:tg.book_id,content:it.content,page_number:it.page_number||'',created_at:now});tg.updated_at=now;
  await put('books',tg);await put('books',{...it,deleted:true,updated_at:now});await loadBooks();render();inboxSheet();queueSync()}
 else if(a==='ib_del'){const it=inbox.find(x=>x.book_id===t.dataset.x);if(it&&confirm('刪除這句暫存金句？')){await put('books',{...it,deleted:true,updated_at:new Date().toISOString()});await loadBooks();render();inboxSheet();queueSync()}}
 else if(a==='search')doSearch();
 else if(a==='pick'){const r=sr[+t.dataset.i];if(!r)return;
  if(!r.desc&&r.key){try{const w=await fj('https://openlibrary.org'+r.key+'.json'),d=w.description;r.desc=typeof d==='string'?d:(d&&d.value)||''}catch(err){}}
  editing={cover_image:r.cover};openSheet(form({title:r.title,author:r.author,description:r.desc,category_id:r.cat,status:'want',cover_image:r.cover}))}
 else if(a==='settings')settings();
 else if(a==='ssave'){const g=($('#s_gk')?.value||'').trim(),u=($('#s_url')?.value||'').replace(/\s+/g,''),k=($('#s_key')?.value||'').trim(),m=$('#s_msg');
  localStorage.setItem('ru_gkey',g);
  if(!u){m.textContent='第一欄（網頁應用程式網址）是空的。';return}
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){m.textContent='第一欄的網址格式不對（結尾應為 /exec）。你貼的開頭是：'+u.slice(0,40);return}
  if(!k){m.textContent='第二欄（密碼）是空的。';return}
  localStorage.setItem('ru_url',u);localStorage.setItem('ru_key',k);localStorage.removeItem('ru_last');m.textContent='設定已儲存，同步中…';sync()}
 else if(a==='slink'){const c=cfg(),u=($('#s_url')?.value||c.u).replace(/\s+/g,''),k=($('#s_key')?.value||c.k).trim(),g=($('#s_gk')?.value||localStorage.getItem('ru_gkey')||'').trim(),m=$('#s_msg');
  if(!u||!k){m.textContent='無法產生連結：'+(!u?'第一欄（網址）':'第二欄（密碼）')+'是空的。';return}
  const link=location.origin+location.pathname+'#setup='+btoa(unescape(encodeURIComponent(JSON.stringify({u,k,g}))));
  try{await navigator.clipboard.writeText(link);m.textContent='已複製設定連結。請貼到備忘錄保存，不要分享給別人。'}catch(err){prompt('請全選並複製這個連結：',link)}}
 else if(a==='snow')sync();
 else if(a==='soff'){if(confirm('中斷後不再同步，這支手機上的資料仍會保留。確定嗎？')){localStorage.removeItem('ru_url');localStorage.removeItem('ru_key');localStorage.removeItem('ru_last');syncSt='';syncAt='';setSt('','已中斷連線');render()}}
 else if(a==='save')save();
 else if(a==='close')closeSheet();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=listHTML()}else if(e.target.id==='sq')sq=e.target.value;else if(e.target.id==='o_txt'&&ocr)ocr.text=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sq'){e.preventDefault();e.target.blur();doSearch()}});
document.addEventListener('change',e=>{const i=e.target.id;
 if(i==='catF'){catF=e.target.value;$('#list').innerHTML=listHTML()}
 else if(i==='yF'){yF=e.target.value;$('#list').innerHTML=listHTML()}
 else if(i==='sy'){sy=+e.target.value;render()}
 else if(i==='f_cam'||i==='f_pic'){const f=e.target.files[0];e.target.value='';onImage(f)}
 else if(i==='f_status')$('#readbox').style.display=e.target.value==='read'?'block':'none';
 else if(i==='f_src')$('#f_srco').style.display=e.target.value==='__o'?'block':'none';
});
setInterval(()=>{const el=$('#tm');if(!el)return;const b=books.find(x=>x.book_id===el.dataset.id);if(b)el.textContent=fd(elapsed(b)/1000)},1000);
(async()=>{
 applySetup();
 try{db=await openDB();cats=await getAll('categories');
  if(!cats.length){cats=DEF.map((name,i)=>({category_id:'c'+(i+1),name}));for(const c of cats)await put('categories',c)}
  await loadBooks();navigator.storage?.persist?.();
 }catch(err){$('#app').innerHTML='<p class="empty">無法使用瀏覽器儲存空間。請確認不是無痕模式，並用 Safari 開啟。</p>';return}
 render();sync();checkUpdate();
})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sync();checkUpdate()}});
